# =============================================================================
# THE vLLM 0.32 BOOT GATE (DSpark branch vllm-0.32). Derived from
# docker-compose.dspark-031.yml (2026-10-18); its gate procedure is docs/port-0.31/GATE.md.
#
# NOT the production compose. A separate service (vllm-dspark032), so its
# container name never matches the one engine-supervisor watches, on its own
# loopback port (18888), with its own JIT cache dir, so nothing it compiles or
# caches can reach the 0.21 engine. Boot it only inside a window, with the
# production engine stopped and ~/.engine-hold set (GATE.md).
#
# Stock vllm/vllm-openai:v0.32.0 (pin it by digest: DSPARK032_IMAGE),
# upstream DeepSeek V4 + DSpark on model runner V2, fp8_ds_mla KV, b12x MoE
# (W4A16), and the patches-032 set (the patches-031 overlays merged onto
# v0.32.0; the dspark031 plugin is shared, unchanged). kvmgr 0.6.0 is mounted
# and OFF unless KV_TRANSFER_CONFIG_032 is set; dispram is not ported.
#
# Generated from docker-compose.dspark.yml's environment (2026-10-16): kept
# every setting 0.31 still reads; dropped (0.21-only or replaced):
#   B12X_W4A16_TC_DECODE DG_JIT_NVCC_COMPILER DSPARK_SLOT_CLAMP KV_TRANSFER_CONFIG PYTHONPATH SAFETENSORS_LOAD_STRATEGY VLLM_B12X_W4A16_FORCE_BLOCKS_MAX_M VLLM_B12X_W4A16_FORCE_BLOCKS_PER_SM VLLM_B12X_W4A16_FORCE_TILE_CONFIG VLLM_DSPARK_CONFIDENCE_SCHEDULER VLLM_DSPARK_CONFIDENCE_THRESHOLD VLLM_DSPARK_FUSED_MARKOV_ARGMAX VLLM_DSPARK_GPU_REJECTED_CONTEXT_MASK VLLM_DSPARK_HARDWARE_SCHEDULER_EARLY_STOP VLLM_DSPARK_LOCAL_ARGMAX VLLM_DSPARK_REFERENCE_KV_QUANT_DEQUANT VLLM_DSPARK_REPLICATE_MARKOV_W1 VLLM_DSV4_B12X_COMPRESSED_MLA VLLM_DSV4_DSPARK_DEFER_TARGET_CAPTURE VLLM_DSV4_DSPARK_DEFER_TARGET_CAPTURE_EXACT VLLM_PROTECTED_PROMPT_BLOCKS_FRACTION VLLM_SKIP_INIT_MEMORY_CHECK VLLM_TRITON_MLA_SPARSE VLLM_USE_B12X_MOE VLLM_USE_B12X_WO_PROJECTION
# =============================================================================
services:
  vllm-dspark032:
    image: ${DSPARK032_IMAGE:-vllm/vllm-openai:v0.32.0}
    network_mode: host
    ipc: host
    restart: "no"
    shm_size: "64gb"
    logging:
      driver: journald
      options:
        tag: "dspark032-vllm-{{.Name}}"
    ulimits:
      memlock: -1
      stack: 67108864
    gpus: all
    devices:
      - /dev/infiniband:/dev/infiniband
    entrypoint: ["bash", "-lc"]
    volumes:
      - ${LOCAL_MODELS_DIR:-${HF_CACHE:-${HOME}/.cache/huggingface}}:/models:ro
      - ${HF_CACHE:-${HOME}/.cache/huggingface}:/cache/huggingface
      # its OWN cache dir: 0.32's FlashInfer/DeepGEMM JIT must not share 0.31's or 0.21's
      - ${JIT_CACHE_DIR_032:-${HOME}/.cache/vllm-dspark032}:/vllm-cache
      - ./patches-032/anthropic_protocol.py:/usr/local/lib/python3.12/dist-packages/vllm/entrypoints/anthropic/protocol.py:ro
      - ./patches-032/anthropic_serving.py:/usr/local/lib/python3.12/dist-packages/vllm/entrypoints/anthropic/serving.py:ro
      - ./patches-032/detokenizer.py:/usr/local/lib/python3.12/dist-packages/vllm/v1/engine/detokenizer.py:ro
      - ./patches-032/tokenizer_deepseek_v4.py:/usr/local/lib/python3.12/dist-packages/vllm/tokenizers/deepseek_v4.py:ro
      - ./patches-031/dspark031_plugin:/opt/dspark031:ro
      # b12x is an OPTIONAL extra of vllm (0.32 pins b12x==1.5.1; 0.31 1.3.0) the stock image leaves
      # out: without it --moe-backend b12x fails at layer init ("kernel does not
      # support current device"). Installed --no-deps beside, never into, the
      # image (GATE.md, "Before the window").
      - ${B12X_DIR_032:-${HOME}/dspark032-deps/b12x-1.5.1}:/opt/b12x:ro
      - ./patches/prefill_plugin/prefill_collector.py:/usr/local/lib/python3.12/dist-packages/prefill_collector.py:ro
      - ./patches/prefill_plugin/prefill_collector-0.1.dist-info:/usr/local/lib/python3.12/dist-packages/prefill_collector-0.1.dist-info:ro
      - ./patches/safetensors_e8m0_plugin/safetensors_e8m0.py:/usr/local/lib/python3.12/dist-packages/safetensors_e8m0.py:ro
      - ./patches/safetensors_e8m0_plugin/safetensors_e8m0-0.1.dist-info:/usr/local/lib/python3.12/dist-packages/safetensors_e8m0-0.1.dist-info:ro
      - /var/tmp/vllm-kv-flags:/etc/vllm-kv-flags:ro
      # kvmgr 0.6.0 (the vLLM 0.32 line): its OWN worktree and its OWN tier.
      # Inert unless KV_TRANSFER_CONFIG_032 is set. NEVER 0.31's
      # ~/vllm-kvmgr-031 / ~/kvoffload-031, nor 0.21's ~/vllm-kvmgr / ~/kvoffload.
      - ${KVMGR_DIR_032:-${HOME}/vllm-kvmgr-032}/src/kvmgr:/usr/local/lib/python3.12/dist-packages/kvmgr:ro
      - ${KVMGR_DIR_032:-${HOME}/vllm-kvmgr-032}/deploy/vllm_kvmgr-0.6.0.dist-info:/usr/local/lib/python3.12/dist-packages/vllm_kvmgr-0.6.0.dist-info:ro
      - ${KVOFFLOAD_DIR_032:-${HOME}/kvoffload-032}:/kvoffload
    environment:
      HF_HOME: /cache/huggingface
      SERPER_API_KEY: "${SERPER_API_KEY:-}"
      HF_HUB_OFFLINE: "${HF_HUB_OFFLINE:-0}"
      TRANSFORMERS_OFFLINE: "${TRANSFORMERS_OFFLINE:-0}"
      HF_HUB_DISABLE_XET: "${HF_HUB_DISABLE_XET:-1}"
      STRIP_LEAKED_COT: "${STRIP_LEAKED_COT:-1}"        # Patch 8
      MODEL_ALIAS_THINKING: "${MODEL_ALIAS_THINKING:-1}"  # Patch 9
      CLASSIFIER_NOTHINK: "${CLASSIFIER_NOTHINK:-1}"      # Patch 9
      TOOL_ARGS_STRICT: "${TOOL_ARGS_STRICT:-0}"          # Patch 10
      VLLM_SKIP_MODEL_NAME_VALIDATION: "${VLLM_SKIP_MODEL_NAME_VALIDATION:-1}"
      PYTHONHASHSEED: "${PYTHONHASHSEED:-20261007}"
      PREFIX_WATCH: "${PREFIX_WATCH:-1}"
      STICKY_TOOLS: "${STICKY_TOOLS:-1}"
      STICKY_TOOLS_TTL: "${STICKY_TOOLS_TTL:-3600}"
      VLLM_CACHE_ROOT: /vllm-cache
      DG_JIT_CACHE_DIR: /vllm-cache/deepgemm-cache
      FLASHINFER_WORKSPACE_BASE: /vllm-cache/flashinfer
      TILELANG_CACHE_DIR: /vllm-cache/tilelang
      TORCHINDUCTOR_CACHE_DIR: /vllm-cache/torchinductor-cache
      TRITON_CACHE_DIR: /vllm-cache/triton-cache
      TORCH_EXTENSIONS_DIR: /vllm-cache/torch_extensions
      VLLM_ENGINE_READY_TIMEOUT_S: "${VLLM_ENGINE_READY_TIMEOUT_S:-3600}"
      VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "${VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS:-1800}"
      VLLM_HOST_IP: "${VLLM_HOST_IP:-}"
      VLLM_ALLOW_LONG_MAX_MODEL_LEN: "${VLLM_ALLOW_LONG_MAX_MODEL_LEN:-1}"
      VLLM_SPARSE_INDEXER_MAX_LOGITS_MB: "${VLLM_SPARSE_INDEXER_MAX_LOGITS_MB:-256}"
      VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: "${VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS:-0}"
      VLLM_USE_FLASHINFER_SAMPLER: "${VLLM_USE_FLASHINFER_SAMPLER:-1}"
      TORCH_CUDA_ARCH_LIST: "${TORCH_CUDA_ARCH_LIST:-12.1a}"
      FLASHINFER_CUDA_ARCH_LIST: "${FLASHINFER_CUDA_ARCH_LIST:-12.1a}"
      FLASHINFER_DISABLE_VERSION_CHECK: "${FLASHINFER_DISABLE_VERSION_CHECK:-1}"
      TILELANG_CLEANUP_TEMP_FILES: "${TILELANG_CLEANUP_TEMP_FILES:-1}"
      DG_JIT_USE_NVRTC: "${DG_JIT_USE_NVRTC:-0}"
      PYTORCH_CUDA_ALLOC_CONF: "${PYTORCH_CUDA_ALLOC_CONF:-expandable_segments:True}"
      CUDA_LAUNCH_BLOCKING: "${CUDA_LAUNCH_BLOCKING:-}"
      NCCL_NET: "${NCCL_NET:-IB}"
      NCCL_IB_DISABLE: "${NCCL_IB_DISABLE:-0}"
      NCCL_IB_HCA: "${NCCL_IB_HCA}"
      NCCL_SOCKET_IFNAME: "${NCCL_SOCKET_IFNAME}"
      NCCL_IB_MERGE_NICS: "${NCCL_IB_MERGE_NICS:-}"
      GLOO_SOCKET_IFNAME: "${GLOO_SOCKET_IFNAME:-${NCCL_SOCKET_IFNAME}}"
      TP_SOCKET_IFNAME: "${TP_SOCKET_IFNAME:-${NCCL_SOCKET_IFNAME}}"
      NCCL_IB_GID_INDEX: "${NCCL_IB_GID_INDEX:-}"
      NCCL_CROSS_NIC: "${NCCL_CROSS_NIC:-1}"
      NCCL_CUMEM_ENABLE: "${NCCL_CUMEM_ENABLE:-0}"
      NCCL_IGNORE_CPU_AFFINITY: "${NCCL_IGNORE_CPU_AFFINITY:-1}"
      NCCL_DEBUG: "${NCCL_DEBUG:-WARN}"
      NCCL_NVLS_ENABLE: "${NCCL_NVLS_ENABLE:-0}"
      NCCL_BUFFSIZE: "${NCCL_BUFFSIZE:-1048576}"
      NCCL_LL128_BUFFSIZE: "${NCCL_LL128_BUFFSIZE:-262144}"
      NCCL_PROTO: "${NCCL_PROTO:-^LL128}"
      NCCL_MAX_NCHANNELS: "${NCCL_MAX_NCHANNELS:-8}"
      NODE_RANK: "${NODE_RANK}"
      HEADLESS: "${HEADLESS:-}"
      MASTER_ADDR: "${MASTER_ADDR}"
      MASTER_PORT: "${MASTER_PORT:-25000}"
      MTP_NUM_TOKENS: "${MTP_NUM_TOKENS:-5}"
      DEFAULT_CHAT_TEMPLATE_KWARGS: "${DEFAULT_CHAT_TEMPLATE_KWARGS:-}"
      # NOT production's HF_OVERRIDES: that names our 0.21 vision port's class
      # (DeepseekV4VForConditionalGeneration). 0.31 has Vision-Exp upstream.
      # (default set in the command: a literal } cannot sit in a compose default)
      HF_OVERRIDES: "${HF_OVERRIDES_032:-}"
      COMPILATION_CONFIG: "${COMPILATION_CONFIG:-}"
      # production's points at a file this compose does not mount
      VLLM_LOGGING_CONFIG_PATH: "${VLLM_LOGGING_CONFIG_PATH_032:-}"
      # the same bytes as production by default, so the token counts compare
      KV_CACHE_MEMORY_BYTES: "${KV_CACHE_MEMORY_BYTES_032-${KV_CACHE_MEMORY_BYTES:-}}"
      # kvmgr on: e.g. production's KV_TRANSFER_CONFIG. Not read from it, so
      # production's env file never turns it on by accident.
      KV_TRANSFER_CONFIG: "${KV_TRANSFER_CONFIG_032:-}"
      # --- 0.31/0.32-specific (the plugin keeps its dspark031 names) ---
      PYTHONPATH: /opt/dspark031:/opt/b12x
      DSPARK031_LOAD_PROBE: "${DSPARK031_LOAD_PROBE:-0}"   # diagnostic (dspark031.py)
      # NOT production's DG_JIT_NVCC_COMPILER (/opt/env/bin/nvcc, the 0.21 image)
      DG_JIT_NVCC_COMPILER: "${DG_JIT_NVCC_COMPILER_032:-/usr/local/cuda/bin/nvcc}"
      # the 64K-page kernel hangs the default lazy loader (GATE.md)
      SAFETENSORS_LOAD_STRATEGY: "${SAFETENSORS_LOAD_STRATEGY:-eager}"
      # our W4A16 MoE choice on upstream's b12x backend (0.21: VLLM_USE_B12X_MOE)
      VLLM_B12X_MOE_FP4_FORCE_A16: "${VLLM_B12X_MOE_FP4_FORCE_A16:-1}"
    command:
      - >
        SPECULATIVE_CONFIG="{\"method\":\"dspark\",\"num_speculative_tokens\":${MTP_NUM_TOKENS:-5},\"draft_sample_method\":\"probabilistic\"}";
        CHAT_TEMPLATE_KWARGS="$${DEFAULT_CHAT_TEMPLATE_KWARGS:-}";
        [ -n "$${CHAT_TEMPLATE_KWARGS}" ] || CHAT_TEMPLATE_KWARGS='{"thinking":false}';
        [ -n "$${HF_OVERRIDES}" ] || HF_OVERRIDES='{"architectures":["DeepseekV4ForConditionalGeneration"]}';
        echo "dspark032 gate: kwargs=$${CHAT_TEMPLATE_KWARGS} hf_overrides=$${HF_OVERRIDES} max_model_len=${MAX_MODEL_LEN_032:-262144}";
        exec vllm serve ${DSPARK_MODEL:-deepseek-ai/DeepSeek-V4-Flash-DSpark}
        --served-model-name ${SERVED_MODEL_NAME:-deepseek-v4-flash-dspark}
        ${SERVED_MODEL_ALIASES:-deepseek-v4-flash-dspark-nothink deepseek-v4-flash-dspark-think-low deepseek-v4-flash-dspark-think-high deepseek-v4-flash-dspark-think-max claude-haiku-4-5 claude-haiku-4-5-20251001 claude-sonnet-5 claude-sonnet-4-6 claude-opus-5 claude-opus-5-5 claude-opus-4-6 claude-fable-5}
        --host 127.0.0.1
        --port ${VLLM_PORT_032:-18888}
        --trust-remote-code
        --tensor-parallel-size 2
        --pipeline-parallel-size 1
        --kv-cache-dtype ${KV_CACHE_DTYPE_032:-fp8}
        --block-size 256
        --max-model-len ${MAX_MODEL_LEN_032:-262144}
        --max-num-seqs ${MAX_NUM_SEQS:-6}
        --max-num-batched-tokens ${MAX_NUM_BATCHED_TOKENS:-8192}
        --long-prefill-token-threshold ${LONG_PREFILL_TOKEN_THRESHOLD:-1024}
        --gpu-memory-utilization ${GPU_MEMORY_UTILIZATION:-0.80}
        --safetensors-load-strategy "$${SAFETENSORS_LOAD_STRATEGY}"
        $${KV_CACHE_MEMORY_BYTES:+--kv-cache-memory-bytes "$$KV_CACHE_MEMORY_BYTES"}
        $${KV_TRANSFER_CONFIG:+--kv-transfer-config "$$KV_TRANSFER_CONFIG"}
        --enable-prefix-caching
        --async-scheduling
        --enable-chunked-prefill
        --speculative-config "$${SPECULATIVE_CONFIG}"
        --tokenizer-mode deepseek_v4
        --distributed-executor-backend mp
        --tool-call-parser deepseek_v4
        --enable-auto-tool-choice
        --reasoning-parser deepseek_v4
        --reasoning-config '{"reasoning_parser":"deepseek_v4","reasoning_start_str":"<think>","reasoning_end_str":"</think>"}'
        --default-chat-template-kwargs "$${CHAT_TEMPLATE_KWARGS}"
        --generation-config vllm
        --moe-backend ${MOE_BACKEND_032:-b12x}
        --enable-flashinfer-autotune
        --nnodes 2
        --node-rank ${NODE_RANK}
        --master-addr ${MASTER_ADDR}
        --master-port ${MASTER_PORT:-25000}
        $${HF_OVERRIDES:+--hf-overrides "$$HF_OVERRIDES"}
        $${COMPILATION_CONFIG:+--compilation-config "$$COMPILATION_CONFIG"}
        ${HEADLESS:+--headless}
