services:
  vllm-dspark:
    image: ${DSPARK_VLLM_IMAGE:-vllm-dspark-runtime:dspark-nvfp4-stage-c}
    network_mode: host
    ipc: host
    # *** "no", AND NEVER A DOCKER RESTART POLICY, because Docker restarts ONE
    # *** node. *** Two ranks are one engine: a rank restarted alone hangs in
    # NCCL init for ever (2026-10-10), or by luck pairs up again after a
    # ten-minute NCCL timeout on the survivor (2026-10-14, ~20 minutes of client
    # hangs then 500/502/503). Crash recovery is local-ops/systemd/
    # engine-supervisor.sh on the head: `down` on BOTH, then the start script.
    restart: "no"
    shm_size: "64gb"

    # Log to the journal, not to the container's json-file.
    #
    # stop-deepseek-v4-flash-dspark.sh runs `docker compose ... down`, which
    # removes the containers -- and json-file logs die with the container they
    # belong to. By the time you know you want a log, the container that held
    # it is gone. journald keeps the lines after the container is removed.
    #
    # Retrieve with (the -a matters -- vLLM's progress bars emit carriage
    # returns, and without -a journalctl renders them as "[108B blob data]"):
    #   journalctl -a CONTAINER_TAG=dspark-vllm-dspark-recipe-vllm-dspark-1
    #
    # `docker logs` keeps working under this driver, so no workflow changes.
    logging:
      driver: journald
      options:
        tag: "dspark-vllm-{{.Name}}"

    ulimits:
      memlock: -1
      stack: 67108864

    gpus: all

    devices:
      - /dev/infiniband:/dev/infiniband

    volumes:
      # Serve weights already on disk instead of downloading through the HF
      # cache: set LOCAL_MODELS_DIR in .env.dspark (it reaches both nodes, since
      # the launcher passes the env file to worker and head) and point
      # DSPARK_MODEL at /models/<dir>. Defaults to the HF cache dir, so leaving
      # it unset mounts nothing new.
      #
      # DSPARK_MODEL must name a real directory inside the mount — a symlink
      # whose target lies outside it resolves to a host path the container
      # cannot see, and vLLM then treats the value as an HF repo id
      # (HFValidationError: Repo id must be in the form ...).
      - ${LOCAL_MODELS_DIR:-${HF_CACHE:-${HOME}/.cache/huggingface}}:/models:ro
      - ${HF_CACHE:-${HOME}/.cache/huggingface}:/cache/huggingface
      # NODE-LOCAL JIT/compile caches — deliberately a SEPARATE mount from
      # HF_CACHE. Seven caches are written concurrently by both ranks; if they
      # land on a shared (NFS) HF cache the failures are serial and misleading:
      # a torch.compile makedirs race, DeepGEMM "runtime != nullptr" from
      # half-written cubins, and — worst — an ABI-mismatched FlashInfer
      # sampling.so built by one node and silently loaded by the other, silent
      # because this stack runs FLASHINFER_DISABLE_VERSION_CHECK=1. None of the
      # error messages point at the cache. Reported by @antoniohlc (issue #27),
      # who lost a day to it. Keep JIT_CACHE_DIR on local disk on every node.
      - ${JIT_CACHE_DIR:-${HOME}/.cache/vllm-dspark}:/vllm-cache
      # DSpark source patches are baked into the image from recipe/overlay/
      # (see README "vLLM version note"); do not bind-mount a proposer copy
      # here — a copy from one vLLM version crashes another.
      # Inline system message + server-side tool fixes for Claude Code (vllm-project/vllm#44283)
      - ./patches/anthropic_protocol_inline_system.py:/opt/env/lib/python3.12/site-packages/vllm/entrypoints/anthropic/protocol.py:ro
      - ./patches/anthropic_serving_inline_system.py:/opt/env/lib/python3.12/site-packages/vllm/entrypoints/anthropic/serving.py:ro
      # Patch 6 (upstream PR #54, unmerged): caps DSv4 prompt-block protection and
      # recycles sliding-window pages in-request instead of churning the shared LRU.
      # Fixes long-context turns re-prefilling cold (0% hit, 235s) instead of hitting
      # cache (100%, 1.2s). See patches/patch6-single_type_kv_cache_manager.py and
      # STATUS.md "Known issues: KV pool exhaustion under long-context sessions".
      - ./patches/patch6-single_type_kv_cache_manager.py:/opt/env/lib/python3.12/site-packages/vllm/v1/core/single_type_kv_cache_manager.py:ro
      # Patch 7 (ported from co-l/ds4-prefix-cache-fixes 03-dedupe.py): commit-time
      # same-content dedupe in block_pool.cache_full_blocks. Our insert() merges a
      # duplicate (hash, group) into a dict while lookups return only one, so the
      # stale copy holds an LRU slot forever. Remove this line to roll back.
      - ./patches/patch7-block_pool-dedupe.py:/opt/env/lib/python3.12/site-packages/vllm/v1/core/block_pool.py:ro
      # Patch 8 / MNT-8 (ported from vllm#43447): adds FreeKVCacheBlockQueue.prepend_n
      # so a request's UNCACHED scratch pages can go to the front of the free queue
      # and be reused before any cached prefix block. Stock appends both, so every
      # turn buries worthless pages behind live prefixes the allocator then evicts.
      # Inert until the flags file turns it on. Remove this line to roll back.
      - ./patches/patch8-kv_cache_utils.py:/opt/env/lib/python3.12/site-packages/vllm/v1/core/kv_cache_utils.py:ro
      # MNT-10 (2026-09-21): makes --long-prefill-token-threshold live-tunable via
      # the same flags file as MNT-8/9. The V1 scheduler walks self.running in order
      # against ONE shared token_budget, so a request mid-chunked-prefill takes all
      # 8192 and every request behind it gets ZERO tokens that step -- decode falls
      # to 0.2-2 tok/s for minutes at 44-71% KV with zero preemptions. Stock's knob
      # fixes it but is boot-only, and the right value is unknown (vllm#54919 says
      # 4096 was not enough at MNBT=8192). The scheduler re-reads the field every
      # step, so gating it turns a boot-per-arm sweep into a live flip.
      # Boot default is set by --long-prefill-token-threshold below. Remove this
      # line to roll back to stock scheduling.
      - ./patches/mnt10-scheduler.py:/opt/env/lib/python3.12/site-packages/vllm/v1/core/sched/scheduler.py:ro
      # MNT-8 / MNT-9 runtime flags, node-local and NOT part of the repo (like
      # ~/vision-stage). Container env cannot change on a running engine, so an
      # env-gated A/B costs one cold boot per arm; this file is re-read once a
      # second instead. start-deepseek-v4-flash-dspark.sh creates it with both
      # mechanisms OFF. Flip with local-ops/kv-flags.sh.
      - /var/tmp/vllm-kv-flags:/etc/vllm-kv-flags:ro
      # Patch 5 (upstream patches/0005-suppress-stops-in-reasoning.patch): keeps
      # client stop strings dormant inside the reasoning segment, so a CoT that
      # restates a stop phrase cannot decapitate generation before </think> and
      # leave content: null.  Verified 2026-09-16 to apply cleanly to our tree
      # (0.21.1rc1.dev339, 4 hunks / 0 rejects) and staged as a mountable file.
      # INERT under thinking:false -- arming needs <think> in the prompt or as
      # the first output token, and our leak shape has no opening tag.  It is a
      # PREREQUISITE for the thinking:true experiment, not a fix on its own.
      # Opt out with VLLM_SUPPRESS_STOPS_IN_REASONING=0 (process-wide).
      - ./patches/patch5-detokenizer.py:/opt/env/lib/python3.12/site-packages/vllm/v1/engine/detokenizer.py:ro
      # PATCH 14b: the prefill collector -- the per-request prefill rows vLLM
      # measures and then discards (num_cached_tokens, queued/prefill/decode
      # time), published on its own loopback port for sparkstats to proxy.
      #
      # TWO LINES AND NOT ONE, and a .dist-info rather than an import, because
      # of WHEN the engine looks. AsyncLLM is built in
      # build_async_engine_client, which runs BEFORE init_app_state imports the
      # anthropic serving patch -- so importing the collector from that patch
      # is too late; load_stat_logger_plugin_factories() has already run. The
      # supported hook is the vllm.stat_logger_plugins entry-point group, and
      # importlib.metadata finds it off sys.path, so a module and a .dist-info
      # dropped into site-packages is enough with no image rebuild and no
      # wheel. Mounting into site-packages rather than adding PYTHONPATH keeps
      # this to volumes: site-packages is already on the path.
      #
      # It binds 127.0.0.1 INSIDE the container and is reached only through
      # sparkstats. It is deliberately NOT a route on :8888 -- the proxy's
      # Caddy catch-all forwards every path to the vLLM pool, which would put
      # engine observability in front of every mTLS and LAN client.
      - ./patches/prefill_plugin/prefill_collector.py:/opt/env/lib/python3.12/site-packages/prefill_collector.py:ro
      - ./patches/prefill_plugin/prefill_collector-0.1.dist-info:/opt/env/lib/python3.12/site-packages/prefill_collector-0.1.dist-info:ro
      # KV disk-offload tier (probe). Inert unless KV_TRANSFER_CONFIG is set in .env.dspark.
      - ${KVOFFLOAD_DIR:-/home/shorn/kvoffload}:/kvoffload
      # Teach safetensors' EAGER loader the F8_E8M0 dtype string. Required
      # together with --safetensors-load-strategy eager, which the 64k-page
      # kernel requires: the default lazy loader copies from a file-backed mmap
      # and that HANGS on 64k pages, stalling at shard 0 with the GPU idle.
      #
      # The two strategies do not share a decoder. eager goes through
      # safetensors.torch.load, whose Python _TYPES table maps dtype STRINGS and
      # carries only F8_E4M3 and F8_E5M2; the lazy path uses safe_open, which is
      # Rust and knows every dtype. NVFP4 keeps its block scales in E8M0, so the
      # first 60 shards hold 44,259 F8_E8M0 tensors -- every ".scale" -- and
      # eager can decode none of the model without this. It is a
      # safetensors-lagging-torch gap: torch 2.11.0 HAS float8_e8m0fnu and
      # safetensors' own _SIZE table already lists it; only the string mapping
      # is missing.
      #
      # Mounted into site-packages rather than added to PYTHONPATH, for the same
      # reason prefill_collector is: site-packages is already on the path, so
      # this stays a volumes-only change. Discovered through the entry-point
      # group vllm.general_plugins, so nothing is patched in place and we take on
      # no new whole-file mount.
      - ./patches/safetensors_e8m0_plugin/safetensors_e8m0.py:/opt/env/lib/python3.12/site-packages/safetensors_e8m0.py:ro
      - ./patches/safetensors_e8m0_plugin/safetensors_e8m0-0.1.dist-info:/opt/env/lib/python3.12/site-packages/safetensors_e8m0-0.1.dist-info:ro
      # KV cache manager of our own: our MLA manager for KV group 0, with every
      # policy knob readable from /etc/vllm-kv-flags/flags.json (mounted above)
      # and therefore movable WITHOUT a restart -- which matters because a
      # restart of this engine costs a 672-795s cold prefill.
      #
      # A general plugin, like safetensors_e8m0 above, NOT a fourth whole-file
      # overlay: patch6 is 1,809 lines of upstream that must be re-cut on every
      # image bump, and a subclass registered into spec_manager_map is a delta
      # instead of a copy.
      #
      # INERT BY DEFAULT. kvmgr_enabled defaults false, and when false every
      # override calls super(), i.e. patch6 unmodified. The switch is read PER
      # CALL rather than at registration, because the manager class is chosen
      # once while the engine starts -- so a class swap could never be hot.
      # The package is its own repo, deployed by push to ../vllm-kvmgr on each
      # node (the start script refuses unless both are at one commit). The
      # dist-info is the one `pip install` would write, generated from its
      # pyproject.toml by deploy/gen-dist-info.py and checked by its tests.
      - ../vllm-kvmgr/src/kvmgr:/opt/env/lib/python3.12/site-packages/kvmgr:ro
      - ../vllm-kvmgr/deploy/vllm_kvmgr-0.4.8.dist-info:/opt/env/lib/python3.12/site-packages/vllm_kvmgr-0.4.8.dist-info:ro
      # Targeted DEBUG logging, off unless VLLM_LOGGING_CONFIG_PATH is set below.
      # gpu_worker.py:628 computes the two --kv-cache-memory-bytes suggestions and
      # the full memory decomposition (weights / peak activation / non-torch /
      # ACTUAL CUDAGraph / free-vs-total) -- and logs it at DEBUG, so it is never
      # visible at the default level. This config raises ONLY that module, keeping
      # the vllm logger at INFO, because global VLLM_LOGGING_LEVEL=DEBUG buries the
      # message in thousands of lines and can rotate it out of docker logs.
      #
      # THE HANDLER MUST BE DEBUG TOO. DEFAULT_LOGGING_CONFIG sets the handler level
      # from VLLM_LOGGING_LEVEL, so a DEBUG logger behind an INFO handler emits
      # nothing -- the record is created and then dropped on the way out.
      - ./patches/logging-gpuworker-debug.json:/opt/vllm-logging-debug.json:ro
      # dispram: the display carveout, 2046 MiB of device memory the kindling
      # spark-os host lends back through the RM API. Loaded as a vLLM GENERAL
      # PLUGIN, not the source patch: /opt/kindling/dispram/vllm holds
      # kv-cache-from-dispram.patch, which targets vLLM ddd6fbca and edits
      # gpu_worker.py and worker/utils.py -- and gpu_model_runner.py is already
      # one of our whole-file mounts, so the patch would fuzz. The plugin stands
      # aside if the patch is ever present, so the two cannot fight.
      #
      # Discovery is the entry-point group vllm.general_plugins, exactly as
      # prefill_collector above uses vllm.stat_logger_plugins -- the dist-info
      # beside dispram_vllm.py is what makes it discoverable. VLLM_PLUGINS is
      # unset here, so everything discovered loads; setting it would turn it
      # into an allowlist and silently drop whichever name is left out.
      #
      # BOTH NODES OR NO BENEFIT: vLLM takes the SMALLEST KV budget across
      # ranks, so a worker without dispram caps the head node's gain at zero.
      #
      # These paths exist only on kindling spark-os. On DGX OS the bind fails
      # loudly at container create, which is the right failure: it says the host
      # is not the one this config was written for, rather than quietly serving
      # with 2046 MiB less than the launch line claims.
      - /run/dispram:/run/dispram
      - /opt/kindling/dispram/python:/opt/dispram:ro

    environment:
      HF_HOME: /cache/huggingface
      # dispram's plugin lives here (see volumes:). The image sets no PYTHONPATH
      # of its own -- verified with docker image inspect, which shows PATH only --
      # so this is an assignment rather than an append. If a future image gains
      # one, this has to become "/opt/dispram:$${PYTHONPATH}" or the image's own
      # path disappears.
      PYTHONPATH: /opt/dispram
      # Server-side tool execution (web_search via SERPER API)
      SERPER_API_KEY: "${SERPER_API_KEY:-}"
      HF_HUB_OFFLINE: "${HF_HUB_OFFLINE:-0}"
      TRANSFORMERS_OFFLINE: "${TRANSFORMERS_OFFLINE:-0}"
      HF_HUB_DISABLE_XET: "${HF_HUB_DISABLE_XET:-1}"

      # Kill switches for the bind-mounted Anthropic patches. Every one of
      # these is documented in CLAUDE.md as an opt-out, but none of them were
      # passed into the container, so setting one in .env.dspark did nothing
      # (found 2026-09-19 while adding PREFIX_WATCH). Defaults here match each
      # patch's own default, so this block changes no behaviour on its own.
      STRIP_LEAKED_COT: "${STRIP_LEAKED_COT:-1}"        # Patch 8
      MODEL_ALIAS_THINKING: "${MODEL_ALIAS_THINKING:-1}"  # Patch 9
      CLASSIFIER_NOTHINK: "${CLASSIFIER_NOTHINK:-1}"      # Patch 9
      TOOL_ARGS_STRICT: "${TOOL_ARGS_STRICT:-0}"          # Patch 10

      # MODEL-NAME VALIDATION OFF, so this server is model-name agnostic and a
      # new vendor id does not need a restart to be accepted. Upstream's own
      # docstring describes exactly this use: "any model name will be accepted
      # in the 'model' field of requests... useful for proxy/gateway scenarios".
      #
      # WHY. --served-model-name is a LAUNCH ARG, so every new id Anthropic
      # ships (claude-opus-5-5 on 2026-10-01, and whatever follows) otherwise
      # 404s with "The model `x` does not exist" until somebody restarts the
      # engine -- and a restart dumps the prefix cache, which on this engine is
      # ~194s to refill a 54K prompt against 0.9s warm. The alias list below is
      # still maintained, but only so /v1/models ADVERTISES what we use; it is
      # no longer what makes a request work.
      #
      # Four things checked before turning this on, each of which could have
      # made it useless:
      #   - it is the ONLY gate. patches/anthropic_serving_inline_system.py
      #     does no model validation of its own.
      #   - ATTRIBUTION SURVIVES. The anthropic layer passes request.model into
      #     every converter, so the response echoes the id the client asked for
      #     and the proxy's records and pricing stay correct. (The OpenAI layer
      #     would have echoed base_model_paths[0] -- the primary served name --
      #     and silently collapsed every alias into one.)
      #   - MODEL_THINKING_RULES already matches by PREFIX on claude-haiku/
      #     sonnet/opus/fable, so a new VERSION of a known family gets the right
      #     reasoning effort with no edit here.
      #   - /v1/models is unaffected (show_available_models reads the alias list),
      #     so the model picker and the proxy's health count stay clean. Padding
      #     the alias list with guesses would have polluted both.
      # And it sits in envs.py's `ignored_factors`, so it does NOT invalidate the
      # compilation cache: enabling it costs a restart, not a recompile.
      #
      # THE COST, because it is real. A typo is now SERVED rather than refused,
      # and it degrades in two quiet ways: a mistyped family misses the prefix
      # rules above and falls back to --default-chat-template-kwargs, and the
      # proxy prices it with a defaulted rate. The sharper case is a NEW FAMILY
      # rather than a new version -- claude-quartz-5, say -- which has no rule
      # here and silently takes the server default. Set this to 0 to get the
      # loud 404 back.
      VLLM_SKIP_MODEL_NAME_VALIDATION: "${VLLM_SKIP_MODEL_NAME_VALIDATION:-1}"
      # *** PYTHONHASHSEED IS WHAT MAKES A BLOCK HASH SURVIVE A RESTART, and
      # without it disk-backed prefix restore CANNOT WORK AT ALL. ***
      #
      # patch8's init_none_hash does, verbatim:
      #     NONE_HASH = BlockHash(os.urandom(32))   if PYTHONHASHSEED is unset
      #     NONE_HASH = BlockHash(hash_fn(seed))    otherwise
      # and patch8:595 makes NONE_HASH the ROOT of the block-hash Merkle chain
      # (parent_block_hash = NONE_HASH). So with it unset, every block hash is
      # chained off 32 random bytes chosen fresh at every process start, and the
      # .bin files on disk from the previous boot are keyed by hashes this boot
      # can never compute. The fs tier's lookup() is os.path.exists(), so the
      # result is not an error -- it is a MISS, forever. Measured 2026-10-07:
      # 54,070 external-prefix-cache queries, 0 hits, against 27 GB on disk.
      #
      # prefix_caching_hash_algo defaults to sha256 here, NOT one of the two CBOR
      # functions, so init_none_hash's own warning never fires and nothing in the
      # log says any of this. NONE_HASH is the only per-boot randomness; sha256 of
      # a fixed seed is fully deterministic.
      #
      # *** THE VALUE MUST NEVER CHANGE. *** Change it and every block already on
      # disk becomes unreachable -- silently, as a miss rather than an error, with
      # the files still sitting there taking space. It is committed here rather
      # than left to .env.dspark for exactly that reason: .env.dspark is gitignored
      # and per-node, which is how a value that matters gets lost.
      #
      # Not a compile-cache factor (it appears in envs.py only as a comment about
      # Ray env propagation), so setting it costs a RESTART and not a recompile.
      PYTHONHASHSEED: "${PYTHONHASHSEED:-20261007}"
      # Patch 12 prefix-cache tripwire: one INFO line per request carrying
      # four short hashes and a length. Consumed by local-ops/prefix-watch.py.
      PREFIX_WATCH: "${PREFIX_WATCH:-1}"
      # Patch 13 sticky tool set: keep the served tool array monotonic per
      # conversation so a flapping client tool (swift-lsp) cannot shrink it and
      # break the append chain. STICKY_TOOLS=0 disables; TTL in seconds.
      STICKY_TOOLS: "${STICKY_TOOLS:-1}"
      STICKY_TOOLS_TTL: "${STICKY_TOOLS_TTL:-3600}"
      # All seven JIT/workspace caches point at the node-local /vllm-cache
      # volume above, NOT at the HF cache tree. See the volume comment and
      # issue #27 — the set matters, they were found one crash at a time.
      VLLM_CACHE_ROOT: /vllm-cache
      DG_JIT_CACHE_DIR: /vllm-cache/deepgemm-cache
      FLASHINFER_WORKSPACE_BASE: /vllm-cache/flashinfer
      TILELANG_CACHE_DIR: /vllm-cache/tilelang
      TORCHINDUCTOR_CACHE_DIR: /vllm-cache/torchinductor-cache
      TRITON_CACHE_DIR: /vllm-cache/triton-cache
      TORCH_EXTENSIONS_DIR: /vllm-cache/torch_extensions
      # Engine-ready timeout. The stock 600 s trips torch.distributed teardown
      # on a warm restart of this model, which loads 155 GiB across two nodes;
      # the second startup then dies with no useful error. 3600 matches the
      # sparkrun profile (PR #19) — this line is the compose-side mirror.
      VLLM_ENGINE_READY_TIMEOUT_S: "${VLLM_ENGINE_READY_TIMEOUT_S:-3600}"
      # Inference-time RPC deadline. ENGINE_READY_TIMEOUT_S above covers BOOT only.
      # This one guards each execute_model call, and the vLLM default is 300s -- which
      # is shorter than a cold CuTeDSL/TileLang JIT triggered by an MoE/batch shape the
      # warmup never covered. When that happens mid-inference the worker blocks, the
      # deadline declares it dead, and the engine shuts down (issue #8; same anatomy
      # root-caused in MiaAI-Lab/DeepSeek-v4-Flash-DSpark-2x-DGX-Spark#65).
      # 1800 covers observed inference-time JIT with margin. Raising it trades slower
      # detection of a genuinely hung worker -- for that, the tell is 96% GPU at ~18W
      # (spin-wait, not compute), which is far faster to check than any timeout.
      VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "${VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS:-1800}"
      # Long-context crash fix kill-switch (see docs/LONG_CONTEXT_CRASH_FIX.md).
      # 1 (default) = clamp stale DSpark draft-KV slot ids; 0 = detect+log only.
      DSPARK_SLOT_CLAMP: "${DSPARK_SLOT_CLAMP:-1}"
      VLLM_HOST_IP: "${VLLM_HOST_IP:-}"

      VLLM_ALLOW_LONG_MAX_MODEL_LEN: "${VLLM_ALLOW_LONG_MAX_MODEL_LEN:-1}"
      VLLM_TRITON_MLA_SPARSE: "${VLLM_TRITON_MLA_SPARSE:-1}"
      VLLM_SPARSE_INDEXER_MAX_LOGITS_MB: "${VLLM_SPARSE_INDEXER_MAX_LOGITS_MB:-256}"
      VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: "${VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS:-0}"
      VLLM_SKIP_INIT_MEMORY_CHECK: "${VLLM_SKIP_INIT_MEMORY_CHECK:-1}"

      # FlashInfer sampler is part of the 2026-07-03 DSpark garble fix.
      VLLM_USE_FLASHINFER_SAMPLER: "${VLLM_USE_FLASHINFER_SAMPLER:-1}"

      VLLM_USE_B12X_MOE: "${VLLM_USE_B12X_MOE:-1}"
      VLLM_USE_B12X_WO_PROJECTION: "${VLLM_USE_B12X_WO_PROJECTION:-1}"
      VLLM_B12X_W4A16_FORCE_BLOCKS_PER_SM: "${VLLM_B12X_W4A16_FORCE_BLOCKS_PER_SM:-0}"
      VLLM_B12X_W4A16_FORCE_BLOCKS_MAX_M: "${VLLM_B12X_W4A16_FORCE_BLOCKS_MAX_M:-16}"
      VLLM_B12X_W4A16_FORCE_TILE_CONFIG: "${VLLM_B12X_W4A16_FORCE_TILE_CONFIG:-}"
      B12X_W4A16_TC_DECODE: "${B12X_W4A16_TC_DECODE:-0}"

      VLLM_DSPARK_CONFIDENCE_THRESHOLD: "${VLLM_DSPARK_CONFIDENCE_THRESHOLD:-0.0}"
      VLLM_DSPARK_CONFIDENCE_SCHEDULER: "${VLLM_DSPARK_CONFIDENCE_SCHEDULER:-off}"
      VLLM_DSPARK_LOCAL_ARGMAX: "${VLLM_DSPARK_LOCAL_ARGMAX:-1}"
      VLLM_DSPARK_REPLICATE_MARKOV_W1: "${VLLM_DSPARK_REPLICATE_MARKOV_W1:-1}"
      VLLM_DSPARK_FUSED_MARKOV_ARGMAX: "${VLLM_DSPARK_FUSED_MARKOV_ARGMAX:-0}"
      VLLM_DSPARK_GPU_REJECTED_CONTEXT_MASK: "${VLLM_DSPARK_GPU_REJECTED_CONTEXT_MASK:-1}"
      VLLM_DSPARK_REFERENCE_KV_QUANT_DEQUANT: "${VLLM_DSPARK_REFERENCE_KV_QUANT_DEQUANT:-0}"
      VLLM_DSPARK_HARDWARE_SCHEDULER_EARLY_STOP: "${VLLM_DSPARK_HARDWARE_SCHEDULER_EARLY_STOP:-1}"
      VLLM_DSV4_B12X_COMPRESSED_MLA: "${VLLM_DSV4_B12X_COMPRESSED_MLA:-0}"
      VLLM_DSV4_DSPARK_DEFER_TARGET_CAPTURE: "${VLLM_DSV4_DSPARK_DEFER_TARGET_CAPTURE:-0}"
      VLLM_DSV4_DSPARK_DEFER_TARGET_CAPTURE_EXACT: "${VLLM_DSV4_DSPARK_DEFER_TARGET_CAPTURE_EXACT:-0}"

      TORCH_CUDA_ARCH_LIST: "${TORCH_CUDA_ARCH_LIST:-12.1a}"
      FLASHINFER_CUDA_ARCH_LIST: "${FLASHINFER_CUDA_ARCH_LIST:-12.1a}"
      FLASHINFER_DISABLE_VERSION_CHECK: "${FLASHINFER_DISABLE_VERSION_CHECK:-1}"
      TILELANG_CLEANUP_TEMP_FILES: "${TILELANG_CLEANUP_TEMP_FILES:-1}"
      DG_JIT_USE_NVRTC: "${DG_JIT_USE_NVRTC:-0}"
      DG_JIT_NVCC_COMPILER: "${DG_JIT_NVCC_COMPILER:-/opt/env/bin/nvcc}"
      PYTORCH_CUDA_ALLOC_CONF: "${PYTORCH_CUDA_ALLOC_CONF:-expandable_segments:True}"

      # *** A DIAGNOSTIC HOOK FOR ASYNCHRONOUS GPU FAULTS, default UNSET. ***
      # Xid 32 killed a worker twice on 2026-10-09, each time ~4s after a
      # gpu_cache_epoch bump, and both tracebacks pointed at an unrelated sync
      # point -- which is what an async fault always does. The CUDA error
      # message names the remedy itself: "For debugging consider passing
      # CUDA_LAUNCH_BLOCKING=1". With it set, the failure is reported AT the
      # offending launch instead of at the next synchronisation, which is the
      # difference between a traceback that names the kernel and one that names
      # whatever ran next.
      #
      # It SERIALISES every kernel launch, so it is a diagnostic and never a
      # setting: expect a large slowdown. Empty by default so a restart without
      # it in .env.dspark reverts to normal rather than leaving the box crippled
      # -- the same reason PYTHONHASHSEED lives in the committed default and
      # not in .env.dspark.
      CUDA_LAUNCH_BLOCKING: "${CUDA_LAUNCH_BLOCKING:-}"

      NCCL_NET: "${NCCL_NET:-IB}"
      NCCL_IB_DISABLE: "${NCCL_IB_DISABLE:-0}"
      NCCL_IB_HCA: "${NCCL_IB_HCA}"
      NCCL_SOCKET_IFNAME: "${NCCL_SOCKET_IFNAME}"
      # Without this pass-through, NCCL_IB_MERGE_NICS=1 in .env.dspark reaches
      # the launcher's shell but NEVER the container: compose has no env_file,
      # so it delivers only the names listed here. The .env.dspark.example sets
      # it and DEFAULT-CONFIG.md credits it with 98 -> 161 Gb/s busbw, but the
      # container has always come up with it unset.
      NCCL_IB_MERGE_NICS: "${NCCL_IB_MERGE_NICS:-}"
      # The base image bakes GLOO_SOCKET_IFNAME/TP_SOCKET_IFNAME for the
      # author's NIC. On any other host those interfaces do not exist and
      # rank init dies in ProcessGroupGloo (gloo/transport/tcp/device.cc).
      # Default to the NCCL interface so a single .env value covers all three.
      GLOO_SOCKET_IFNAME: "${GLOO_SOCKET_IFNAME:-${NCCL_SOCKET_IFNAME}}"
      TP_SOCKET_IFNAME: "${TP_SOCKET_IFNAME:-${NCCL_SOCKET_IFNAME}}"
      NCCL_IB_GID_INDEX: "${NCCL_IB_GID_INDEX:-}"
      NCCL_CROSS_NIC: "${NCCL_CROSS_NIC:-1}"
      NCCL_CUMEM_ENABLE: "${NCCL_CUMEM_ENABLE:-0}"
      NCCL_IGNORE_CPU_AFFINITY: "${NCCL_IGNORE_CPU_AFFINITY:-1}"
      NCCL_DEBUG: "${NCCL_DEBUG:-WARN}"
      NCCL_NVLS_ENABLE: "${NCCL_NVLS_ENABLE:-0}"

      # Pinned-buffer reclaim. NCCL pins host memory per channel per protocol,
      # and the defaults cost 2,495,520 kB of VmPin per rank here -- measured
      # byte-for-byte identical on both nodes, and byte-for-byte identical to
      # the figure bumblebeers reports before the same change. earlyoom on
      # these boxes fires at `-m 2` of 121 GiB ~= 2.4 GiB available, so those
      # 2.38 GiB of UNRECLAIMABLE pinned pages are almost exactly the margin it
      # needs: it killed the worker three times on 2026-10-04. Reclaiming them
      # frees ~2.3 GiB/node to spend on GPU_MEMORY_UTILIZATION.
      #
      # THESE FOUR LINES ARE NOT REDUNDANT WITH .env.dspark -- do not remove
      # them as duplication. Compose has NO env_file here and delivers only the
      # names listed in this block, which is exactly how NCCL_IB_MERGE_NICS
      # (commented above) has always reached the launcher's shell and never the
      # container. Setting only .env.dspark measures "no change" and concludes
      # wrongly.
      # The defaults here are REAL values and not the empty string, unlike
      # NCCL_IB_MERGE_NICS above. An empty NCCL_PROTO is a *set* variable as
      # far as NCCL is concerned, and an empty protocol list can leave no
      # protocol enabled at all rather than meaning "unset" -- a boot failure
      # instead of a default. Every other entry in this block defaults to a
      # real value for the same reason; the two empty ones are both plain
      # integers where that cannot happen.
      NCCL_BUFFSIZE: "${NCCL_BUFFSIZE:-1048576}"
      NCCL_LL128_BUFFSIZE: "${NCCL_LL128_BUFFSIZE:-262144}"
      NCCL_PROTO: "${NCCL_PROTO:-^LL128}"
      NCCL_MAX_NCHANNELS: "${NCCL_MAX_NCHANNELS:-8}"

      NODE_RANK: "${NODE_RANK}"
      HEADLESS: "${HEADLESS:-}"
      MASTER_ADDR: "${MASTER_ADDR}"
      MASTER_PORT: "${MASTER_PORT:-25000}"
      MTP_NUM_TOKENS: "${MTP_NUM_TOKENS:-5}"

      # Server-side chat-template defaults. Optional; empty keeps the historical
      # '{"thinking":false}'. This is what makes the restored three-level
      # reasoning_effort reachable from configuration instead of per request.
      DEFAULT_CHAT_TEMPLATE_KWARGS: "${DEFAULT_CHAT_TEMPLATE_KWARGS:-}"

      # Vision-Exp: set HF_OVERRIDES in .env to select multimodal arch alias.
      # Empty by default (text-only); vision env sets it to the V4V class.
      HF_OVERRIDES: "${HF_OVERRIDES:-}"
      # Optional raw --compilation-config JSON (cudagraph sizes etc). Empty = vLLM derives.
      COMPILATION_CONFIG: "${COMPILATION_CONFIG:-}"
      # Optional raw --kv-transfer-config JSON (KV disk-offload probe). Empty = off.
      KV_TRANSFER_CONFIG: "${KV_TRANSFER_CONFIG:-}"
      # Must be handed to the container explicitly, because the command uses the
      # CONTAINER-side form $${VAR:+--flag ...} rather than compose-side ${VAR}.
      # Without this line the variable is simply absent inside the container, the
      # conditional expands to nothing, and vLLM silently takes its DEFAULT (lazy)
      # loader -- which HANGS at shard 0 on the 64k kernel with the GPU idle. The
      # same trap docker-compose.yml records for Caddy: a container only sees the
      # variables handed to it, so a compose-side default is not a container-side one.
      SAFETENSORS_LOAD_STRATEGY: "${SAFETENSORS_LOAD_STRATEGY:-}"
      # Set to /opt/vllm-logging-debug.json to surface the kv-cache-memory
      # suggestions (see volumes:). Empty is safe: vLLM tests it for truthiness,
      # so "" takes the default logging config.
      VLLM_LOGGING_CONFIG_PATH: "${VLLM_LOGGING_CONFIG_PATH:-}"
      # Pin the KV pool in BYTES instead of inferring it from gpu_memory_utilization.
      # When set this IGNORES gpu_memory_utilization (config/cache.py) and skips memory
      # profiling entirely, which is the point: the profiler's CUDAGraph estimator is
      # unstable on this box -- measured 0.72, 1.28 and then -0.04 GiB across three
      # starts of the SAME config -- and a negative estimate reserves nothing, so the
      # actual 1.15 GiB of graphs comes out of the KV pool after KV was already sized.
      # That is an over-commit, not a win, even though it reports the largest pool.
      # Derive the value from gpu_worker.py's own suggestion (DEBUG; see
      # VLLM_LOGGING_CONFIG_PATH above) and re-derive it after any change to the model,
      # TP layout, max_num_batched_tokens, max_num_seqs or the driver.
      KV_CACHE_MEMORY_BYTES: "${KV_CACHE_MEMORY_BYTES:-}"

      # Patch 6 knobs (see volumes: above). Defaults match upstream PR #54.
      # MNT-6a's fraction. DEFAULTS TO BLANK ON PURPOSE (2026-10-07): an env
      # value WINS over the flags file in _flag(), so a default here made the
      # single most valuable KV knob restart-only. patch6's
      # _protected_fraction() treats a BLANK value as unset and falls through
      # to the flags file, so leaving PROTECTED_FRACTION unset in .env.dspark
      # is what makes `protected_fraction` live-tunable -- and setting it
      # there still pins an arm for a boot.
      #
      # *** IF YOU UNSET IT HERE, SET protected_fraction IN THE FLAGS FILE. ***
      # With neither, patch6 falls back to 0.30 and retention silently drops
      # from 0.75 -- which looks like nothing happened and costs a cold
      # prefill per long conversation.
      VLLM_PROTECTED_PROMPT_BLOCKS_FRACTION: "${PROTECTED_FRACTION:-}"
      # MNT-6b's switch moved to the FLAGS FILE on 2026-09-20 (`swa_recycle`), so
      # it can be A/B'd without a cold boot per arm. The env var still overrides
      # the file when it is set -- which is exactly why it must NOT be set here:
      # with this line present, `kv-flags.sh swa_recycle 0` would be silently
      # ignored, which is how an arm becomes a confident null. Default with
      # neither set is unchanged (recycling ON).
      #   VLLM_SWA_RECYCLE_SKIPPED_BLOCKS: "${SWA_RECYCLE:-1}"   # removed, see above

    command:
      - bash
      - -lc
      - >
        export PATH="/opt/env/bin:/opt/env/nvvm/bin:/opt/env/targets/sbsa-linux/nvvm/bin:$${PATH:-}";
        export CUDA_HOME="$${CUDA_HOME:-/opt/env/targets/sbsa-linux}";
        export CUDA_PATH="$${CUDA_PATH:-$${CUDA_HOME}}";
        export CUDAToolkit_ROOT="$${CUDAToolkit_ROOT:-$${CUDA_HOME}}";
        export LD_LIBRARY_PATH="/opt/env/lib:/opt/env/targets/sbsa-linux/lib:$${LD_LIBRARY_PATH:-}";
        SPECULATIVE_CONFIG="{\"method\":\"dspark\",\"num_speculative_tokens\":${MTP_NUM_TOKENS:-5},\"draft_sample_method\":\"probabilistic\"}";
        CHAT_TEMPLATE_KWARGS="$${DEFAULT_CHAT_TEMPLATE_KWARGS:-}";
        [ -n "$${CHAT_TEMPLATE_KWARGS}" ] || CHAT_TEMPLATE_KWARGS='{"thinking":false}';
        echo "serving with chat-template-kwargs=$${CHAT_TEMPLATE_KWARGS}";
        exec /opt/env/bin/vllm serve ${DSPARK_MODEL:-deepseek-ai/DeepSeek-V4-Flash-DSpark}
        --served-model-name ${SERVED_MODEL_NAME:-deepseek-v4-flash-dspark}
        ${SERVED_MODEL_ALIASES:-deepseek-v4-flash-dspark-nothink deepseek-v4-flash-dspark-think-low deepseek-v4-flash-dspark-think-high deepseek-v4-flash-dspark-think-max claude-haiku-4-5 claude-haiku-4-5-20251001 claude-sonnet-5 claude-sonnet-4-6 claude-opus-5 claude-opus-5-5 claude-opus-4-6 claude-fable-5}
        --host ${VLLM_HOST:-127.0.0.1}
        --port ${VLLM_PORT:-8888}
        --trust-remote-code
        --tensor-parallel-size 2
        --pipeline-parallel-size 1
        --kv-cache-dtype ${KV_CACHE_DTYPE:-nvfp4_ds_mla}
        --block-size 256
        --max-model-len ${MAX_MODEL_LEN:-1048576}
        --max-num-seqs ${MAX_NUM_SEQS:-6}
        --max-num-batched-tokens ${MAX_NUM_BATCHED_TOKENS:-8192}
        --long-prefill-token-threshold ${LONG_PREFILL_TOKEN_THRESHOLD:-1024}
        --gpu-memory-utilization ${GPU_MEMORY_UTILIZATION:-0.80}
        $${SAFETENSORS_LOAD_STRATEGY:+--safetensors-load-strategy "$$SAFETENSORS_LOAD_STRATEGY"}
        $${KV_CACHE_MEMORY_BYTES:+--kv-cache-memory-bytes "$$KV_CACHE_MEMORY_BYTES"}
        --enable-prefix-caching
        --async-scheduling
        --enable-chunked-prefill
        --speculative-config "$${SPECULATIVE_CONFIG}"
        --tokenizer-mode deepseek_v4
        --distributed-executor-backend mp
        --tool-call-parser deepseek_v4
        --enable-auto-tool-choice
        --reasoning-parser deepseek_v4
        --reasoning-config '{"reasoning_parser":"deepseek_v4","reasoning_start_str":"<think>","reasoning_end_str":"</think>"}'
        --default-chat-template-kwargs "$${CHAT_TEMPLATE_KWARGS}"
        --generation-config vllm
        --enable-flashinfer-autotune
        --nnodes 2
        --node-rank ${NODE_RANK}
        --master-addr ${MASTER_ADDR}
        --master-port ${MASTER_PORT:-25000}
        $${HF_OVERRIDES:+--hf-overrides "$$HF_OVERRIDES"}
        $${COMPILATION_CONFIG:+--compilation-config "$$COMPILATION_CONFIG"}
        $${KV_TRANSFER_CONFIG:+--kv-transfer-config "$$KV_TRANSFER_CONFIG"}
        ${HEADLESS:+--headless}
